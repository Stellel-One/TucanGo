<!DOCTYPE html>
<html lang="es" data-theme="cream">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TucanGo · Acceso Universitario Uniamazonia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/login.css?v=2.6" />
</head>
<body>
  <!-- Canvas invisible para preservar contrato de pruebas automatizadas -->
  <canvas id="flow-scroll-canvas" style="display:none;" aria-hidden="true"></canvas>

  <main class="ios-app-viewport">
    <div class="ios-auth-card">

      <!-- HEADER MINIMALISTA DE MARCA -->
      <header class="ios-brand-header">
        <div class="brand-avatar-box">
          <img
            src="/assets/portal/tucan-portal-badge.png?v=2.6"
            alt="Emblema TucanGo"
            width="44"
            height="52"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <svg viewBox="0 0 40 40" fill="none" class="badge-fallback-svg" style="display:none" aria-hidden="true">
            <path d="M10 30C10 21 16 14 25 14H28V22C28 28 22 32 15 32H10V30Z" fill="#1B4532" />
            <path d="M28 14C32 14 37 16 38 20C35 22 31 22 28 21V14Z" fill="#D7331B" />
            <circle cx="23.5" cy="18.5" r="1.8" fill="#EEE2CB" />
          </svg>
        </div>
        <div class="brand-title-wrap">
          <h1 class="brand-title">TucanGo</h1>
          <span class="brand-subtitle">Universidad de la Amazonia</span>
        </div>
      </header>

      <!-- SESIÓN ACTIVA (SI YA TIENE COOKIE HTTPONLY) -->
      <section id="portal-active-session" class="session-active-card hidden" aria-label="Sesión activa">
        <div class="account-card active-card-static">
          <div class="account-avatar-circle avatar-forest" id="active-user-initials">CR</div>
          <div class="account-info">
            <span class="account-name" id="active-user-name">Carlos Rivera</span>
            <span class="account-role-tag" id="active-user-detail">Pasajero · EST-2024-001</span>
          </div>
        </div>
        <div class="auth-btn-stack">
          <a href="/app" class="btn-tactile btn-tactile-primary">
            <span>Ir a la aplicación</span>
          </a>
          <button type="button" id="btn-logout-portal" class="btn-tactile btn-tactile-secondary">
            <span>Cerrar sesión</span>
          </button>
        </div>
      </section>

      <!-- VISTAS PRINCIPALES DE AUTENTICACIÓN -->
      <section id="portal-auth-views" class="auth-content-box">

        <!-- SELECTOR DE MODO (INICIAR SESIÓN / REGISTRARSE) -->
        <nav class="ios-segmented-control" role="tablist" aria-label="Modo de autenticación">
          <button
            type="button"
            id="tab-btn-login"
            class="ios-segment-btn active"
            data-auth-mode="login"
            role="tab"
            aria-selected="true"
          >
            Iniciar sesión
          </button>
          <button
            type="button"
            id="tab-btn-register"
            class="ios-segment-btn"
            data-auth-mode="register"
            role="tab"
            aria-selected="false"
          >
            Registrarse
          </button>
        </nav>

        <!-- ==================== VISTA 1: INICIAR SESIÓN ==================== -->
        <div id="view-login" class="auth-view-tab">
          <h2 class="view-heading">Elige tu cuenta</h2>

          <!-- CUENTAS RÁPIDAS ESTILO FIGMA DUOLINGO -->
          <div class="account-cards-list" id="account-cards-list">
            <button
              type="button"
              class="account-card"
              data-account-id="1001"
              data-account-role="pasajero"
              title="Ingresar como Carlos Rivera"
            >
              <span class="account-avatar-circle avatar-forest">CR</span>
              <span class="account-info">
                <span class="account-name">Carlos Rivera</span>
                <span class="account-role-tag">Pasajero · Ing. Sistemas</span>
              </span>
              <span class="account-chevron" aria-hidden="true">&rsaquo;</span>
            </button>

            <button
              type="button"
              class="account-card"
              data-account-id="2001"
              data-account-role="motorista"
              title="Ingresar como Jhonatan Silva"
            >
              <span class="account-avatar-circle avatar-tomato">JS</span>
              <span class="account-info">
                <span class="account-name">Jhonatan Silva</span>
                <span class="account-role-tag">Motorista · GNX-45F SOAT OK</span>
              </span>
              <span class="account-chevron" aria-hidden="true">&rsaquo;</span>
            </button>

            <button
              type="button"
              class="account-card"
              data-account-id="1002"
              data-account-role="pasajero"
              title="Ingresar como Laura Gómez"
            >
              <span class="account-avatar-circle avatar-forest-light">LG</span>
              <span class="account-info">
                <span class="account-name">Laura Gómez</span>
                <span class="account-role-tag">Pasajera · Med. Veterinaria</span>
              </span>
              <span class="account-chevron" aria-hidden="true">&rsaquo;</span>
            </button>
          </div>

          <!-- DIVISOR SUTIL -->
          <div class="ios-hairline-divider">
            <span>o con tu documento</span>
          </div>

          <!-- SELECTOR DE ROL MANUAL -->
          <div class="role-segmented-pills" role="radiogroup" aria-label="Rol para ingreso manual">
            <button type="button" class="role-pill-btn active" data-login-role="pasajero">
              Pasajero
            </button>
            <button type="button" class="role-pill-btn" data-login-role="motorista">
              Motorista
            </button>
          </div>

          <!-- FORMULARIO MANUAL AGRUPADO -->
          <form id="form-login-manual" class="ios-form">
            <div class="ios-grouped-inputs">
              <div class="ios-input-row">
                <label for="input-login-id" class="ios-input-label" id="label-login-id">
                  Cédula, código o placa
                </label>
                <input
                  id="input-login-id"
                  type="text"
                  class="ios-input-field"
                  autocomplete="username"
                  required
                  placeholder="Ej. 1001 o GNX-45F"
                />
              </div>
            </div>

            <button type="submit" id="btn-login-submit" class="btn-tactile btn-tactile-primary">
              <span>Ingresar</span>
            </button>
          </form>

          <footer class="view-switch-footer">
            <button type="button" class="footer-link-btn" id="link-go-register">
              ¿No tienes una cuenta? <strong>Regístrate aquí</strong>
            </button>
          </footer>
        </div>

        <!-- ==================== VISTA 2: REGISTRO DE ROLES ==================== -->
        <div id="view-register" class="auth-view-tab hidden">
          <h2 class="view-heading">Crear cuenta</h2>

          <!-- SELECTOR DE ROL PARA REGISTRO -->
          <div class="role-segmented-pills" role="radiogroup" aria-label="Rol a registrar">
            <button type="button" class="role-pill-btn active" data-reg-role="estudiante">
              Estudiante
            </button>
            <button type="button" class="role-pill-btn" data-reg-role="motorista">
              Motorista + Moto
            </button>
          </div>

          <!-- FLUJO 1: REGISTRO DE ESTUDIANTE -->
          <form id="form-reg-estudiante" class="ios-form">
            <div class="ios-grouped-inputs">
              <div class="ios-input-row">
                <label for="reg-est-id" class="ios-input-label">Cédula de ciudadanía</label>
                <input id="reg-est-id" type="text" class="ios-input-field" required placeholder="Ej. 1006888999" />
              </div>
              <div class="ios-input-row">
                <label for="reg-est-cod" class="ios-input-label">Código estudiantil</label>
                <input id="reg-est-cod" type="text" class="ios-input-field" required placeholder="Ej. 202610045" />
              </div>
              <div class="ios-input-row">
                <label for="reg-est-nombre" class="ios-input-label">Nombre completo</label>
                <input id="reg-est-nombre" type="text" class="ios-input-field" required placeholder="Ej. Sofía Muñoz" />
              </div>
              <div class="ios-input-row">
                <label for="reg-est-tel" class="ios-input-label">Teléfono celular</label>
                <input id="reg-est-tel" type="tel" class="ios-input-field" required placeholder="Ej. 3110000000" />
              </div>
              <div class="ios-input-row">
                <label for="reg-est-correo" class="ios-input-label">Correo institucional</label>
                <input
                  id="reg-est-correo"
                  type="email"
                  class="ios-input-field"
                  required
                  placeholder="Ej. s.munoz@uniamazonia.edu.co"
                />
              </div>
              <div class="ios-input-row">
                <label for="reg-est-carrera" class="ios-input-label">Programa académico</label>
                <input
                  id="reg-est-carrera"
                  type="text"
                  class="ios-input-field"
                  required
                  placeholder="Ej. Ingeniería de Sistemas"
                />
              </div>
            </div>

            <button type="submit" class="btn-tactile btn-tactile-forest">
              <span>Crear cuenta de estudiante</span>
            </button>
          </form>

          <!-- FLUJO 2: REGISTRO DE MOTORISTA + MOTOCICLETA -->
          <form id="form-reg-motorista" class="ios-form hidden">
            <span class="form-group-title">Datos personales</span>
            <div class="ios-grouped-inputs">
              <div class="ios-input-row">
                <label for="reg-mot-id" class="ios-input-label">Cédula de ciudadanía</label>
                <input id="reg-mot-id" type="text" class="ios-input-field" required placeholder="Ej. 1117555444" />
              </div>
              <div class="ios-input-row">
                <label for="reg-mot-nombre" class="ios-input-label">Nombre completo</label>
                <input id="reg-mot-nombre" type="text" class="ios-input-field" required placeholder="Ej. Andrés Rojas" />
              </div>
              <div class="ios-input-row">
                <label for="reg-mot-tel" class="ios-input-label">Teléfono celular</label>
                <input id="reg-mot-tel" type="tel" class="ios-input-field" required placeholder="Ej. 3200000000" />
              </div>
              <div class="ios-input-row">
                <label for="reg-mot-correo" class="ios-input-label">Correo electrónico</label>
                <input
                  id="reg-mot-correo"
                  type="email"
                  class="ios-input-field"
                  required
                  placeholder="Ej. a.rojas@udla.edu.co"
                />
              </div>
            </div>

            <span class="form-group-title">Datos de la motocicleta</span>
            <div class="ios-grouped-inputs">
              <div class="ios-input-row">
                <label for="reg-mot-placa" class="ios-input-label">Placa de la moto</label>
                <input id="reg-mot-placa" type="text" class="ios-input-field" required placeholder="Ej. AMZ-77G" />
              </div>
              <div class="ios-input-row">
                <label for="reg-mot-marca" class="ios-input-label">Marca</label>
                <input id="reg-mot-marca" type="text" class="ios-input-field" required placeholder="Ej. Suzuki" />
              </div>
              <div class="ios-input-row">
                <label for="reg-mot-modelo" class="ios-input-label">Modelo / Año</label>
                <input id="reg-mot-modelo" type="text" class="ios-input-field" required placeholder="Ej. Gixxer 150 (2024)" />
              </div>
              <div class="ios-input-row">
                <label for="reg-mot-cc" class="ios-input-label">Cilindraje (CC)</label>
                <input id="reg-mot-cc" type="number" min="50" class="ios-input-field" required value="150" />
              </div>
              <div class="ios-input-row">
                <label for="reg-mot-soat" class="ios-input-label">Número de póliza SOAT</label>
                <input id="reg-mot-soat" type="text" class="ios-input-field" required value="SOAT-2026-FLR" />
              </div>
            </div>

            <label class="ios-checkbox-card">
              <input id="reg-mot-soat-ok" type="checkbox" checked required />
              <span class="checkbox-caption">
                <strong>Certifico SOAT vigente y activo</strong>
                <small>Requisito institucional obligatorio para operar en campus</small>
              </span>
            </label>

            <button type="submit" class="btn-tactile btn-tactile-forest">
              <span>Registrar motorista y motocicleta</span>
            </button>
          </form>

          <footer class="view-switch-footer">
            <button type="button" class="footer-link-btn" id="link-go-login">
              ¿Ya tienes una cuenta? <strong>Inicia sesión</strong>
            </button>
          </footer>
        </div>

      </section>

      <!-- PIE DE PÁGINA LIMPIO -->
      <footer class="ios-app-footer">
        <span>TucanGo v2.6 · Florencia, Caquetá</span>
      </footer>

    </div>
  </main>

  <div id="portal-toast" class="ios-toast hidden" role="status" aria-live="polite"></div>

  <script src="/login.js?v=2.6"></script>
</body>
</html>
