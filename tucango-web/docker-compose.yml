services:
  tucango-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tucango-web
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - NODE_ENV=production
    ports:
      - "3100:3000"
    volumes:
      - tucango_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.tucango-web.rule=Host(`tucango.stellel.com`)"
      - "traefik.http.routers.tucango-web.entrypoints=web"
      - "traefik.http.routers.tucango-web.service=tucango-web"
      - "traefik.http.services.tucango-web.loadbalancer.server.port=3000"

volumes:
  tucango_data:

networks:
  dokploy-network:
    external: true
