schema: spec-driven

context: |
  Course: Lógica & Algoritmos II (Universidad de la Amazonia, Ingeniería de Sistemas)
  Stack: Java (intended, OOP) — no build tool configured yet (Maven/Gradle decision pending)
  Toolchain: JDK 21 (Microsoft OpenJDK 21.0.12)
